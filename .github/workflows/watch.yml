name: JobStep viral watch

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal = alerts + build pages · only-detect = alerts only · dry-run = no alerts, no writes'
        type: choice
        options: [normal, only-detect, dry-run, test-notify, test-claude, check-hot, test-discord, relist, weekly, own-sync, lineup, lineup-apply, localize, localize-recheck, reword, reword-dry, audit, accounts-sync, init-fr, init-es]
        default: normal
      test_viral:
        description: 'Optional: TikTok video URL -> send the full VIRAL Slack message for it (no Notion changes)'
        required: false
        default: ''
      discord_message_id:
        description: 'Optional: id of a DACH hot announcement -> rewrite it with the current text (no new ping)'
        required: false
        default: ''
      test_video:
        description: 'Optional: TikTok video URL -> build a TEST format page into the private radar page (nothing public)'
        required: false
        default: ''

concurrency:
  group: jobstep-viral-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Check out state branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: state-branch

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tor > /dev/null
          pip install -q -r requirements.txt

      # GitHub's servers are in the US; some JobStep videos are Europe-only. Those requests go through Tor
      # with European exit nodes (only used as a fallback, see watcher/tiktok.py).
      - name: Start European route (Tor)
        continue-on-error: true
        run: |
          sudo systemctl stop tor tor@default 2>/dev/null || true
          printf 'SocksPort 9150\nExitNodes {de},{at},{ch},{nl},{be},{fr},{pl},{cz},{dk},{se}\nStrictNodes 1\nLog notice file /tmp/tor.log\n' > /tmp/torrc
          tor -f /tmp/torrc --RunAsDaemon 1 --DataDirectory /tmp/tordata
          for i in $(seq 1 60); do grep -q "Bootstrapped 100%" /tmp/tor.log 2>/dev/null && break; sleep 2; done
          grep -q "Bootstrapped 100%" /tmp/tor.log && echo "Tor ready" || echo "Tor not ready - Europe-only videos will use embed view counts"

      - name: Run watcher
        env:
          STATE_DIR: state-branch/state
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SONIOX_API_KEY: ${{ secrets.SONIOX_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_FR: ${{ secrets.DISCORD_WEBHOOK_URL_FR }}
          DISCORD_WEBHOOK_URL_ES: ${{ secrets.DISCORD_WEBHOOK_URL_ES }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          LIGHTREEL_API_KEY: ${{ secrets.LIGHTREEL_API_KEY }}
          TIKTOK_PROXY: socks5h://127.0.0.1:9150
          MODE: ${{ github.event.inputs.mode || 'normal' }}
          TEST_VIDEO: ${{ github.event.inputs.test_video }}
          TEST_VIRAL: ${{ github.event.inputs.test_viral }}
          DISCORD_MESSAGE_ID: ${{ github.event.inputs.discord_message_id }}
        run: |
          if [ -n "$DISCORD_MESSAGE_ID" ]; then python -m watcher.main --edit-discord "$DISCORD_MESSAGE_ID"; exit 0; fi
          if [ -n "$TEST_VIRAL" ]; then python -m watcher.main --test-viral "$TEST_VIRAL"; exit 0; fi
          if [ -n "$TEST_VIDEO" ]; then
            HANDLE=$(echo "$TEST_VIDEO" | sed -E 's#.*/@([^/]+)/video/([0-9]+).*#\1#')
            VID=$(echo "$TEST_VIDEO" | sed -E 's#.*/@([^/]+)/video/([0-9]+).*#\2#')
            python scripts/test_build.py "$HANDLE" "$VID"
            exit 0
          fi
          case "$MODE" in
            dry-run)     python -m watcher.main --dry-run ;;
            test-notify) python -m watcher.main --test-notify ;;
            test-claude) python -m watcher.main --test-claude ;;
            check-hot)   python -m watcher.main --check-hot ;;
            test-discord) python -m watcher.main --test-discord ;;
            relist)      python -m watcher.main --relist ;;
            weekly)      python -m watcher.main --weekly ;;
            own-sync)    python -m watcher.main --own-sync ;;
            lineup)      python -m watcher.main --lineup ;;
            lineup-apply) python -m watcher.main --lineup-apply ;;
            localize)    python -m watcher.main --localize ;;
            localize-recheck) python -m watcher.main --localize-recheck ;;
            reword)      python -m watcher.main --reword ;;
            reword-dry)  python -m watcher.main --reword-dry ;;
            audit)       python -m watcher.main --audit ;;
            accounts-sync) python -m watcher.main --accounts-sync registry/accounts_sync.json ;;
            init-fr)     python -m watcher.main --init-market fr ;;
            init-es)     python -m watcher.main --init-market es ;;
            only-detect) python -m watcher.main --only-detect ;;
            *)           python -m watcher.main ;;
          esac

      - name: Save state
        if: always()
        working-directory: state-branch
        run: |
          git config user.name "jobstep-viral-watch"
          git config user.email "actions@users.noreply.github.com"
          git add -A state
          git diff --cached --quiet || (git commit -q -m "state $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q)
